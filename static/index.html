<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover — чтобы приложение занимало весь экран, включая
       зону под чёлкой; user-scalable=no — Telegram не масштабируется жестами -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Баскетбольный центр</title>

  <!-- SDK Telegram Mini Apps. Даёт доступ к теме пользователя, кнопке «Назад»,
       развороту на весь экран. Грузится до нашего кода, поэтому к моменту его
       запуска объект Telegram.WebApp уже готов. Вне Telegram скрипт просто
       ничего не делает, и приложение работает как обычный сайт. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
  <div id="app"></div>
  <!-- переводы интерфейса подключаем ДО основного кода, чтобы функция t()
       была доступна везде -->
  <script src="/static/js/i18n.js?v=5"></script>
  <script src="/static/js/app.js?v=5"></script>
</body>
</html>
